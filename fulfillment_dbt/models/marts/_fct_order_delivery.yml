version: 2

models:
  - name: fct_order_delivery
    description: One row per delivered order, with SLA outcome, customer and latest review score.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: delivered_at
        data_tests:
          - not_null
      - name: is_late
        data_tests:
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false